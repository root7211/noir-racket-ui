[package]
name = "noir-wgpu-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.15", features = ["derive"] }
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# wgpu 30的官方MSRV为Rust 1.87；显式锁定间接依赖以避免基准环境漂移。
indexmap = "2.7"
wgpu = "=30.0.0"
# 当前 sandbox/目标验证使用 X11；关闭 Wayland 可避免 scanner 引入高 MSRV quick-xml。
winit = { version = "=0.29.15", default-features = false, features = ["x11", "rwh_06"] }
