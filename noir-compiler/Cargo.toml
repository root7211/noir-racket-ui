[package]
name = "noir-compiler"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Pure bounded application-profile lowering for Noir"
license = "MIT"

[lib]
name = "noir_compiler"
path = "src/lib.rs"

[[bin]]
name = "noir-compiler"
path = "src/bin/noir_compiler.rs"

[dependencies]
anyhow = "1.0"
noir-ir = { path = "../noir-ir" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
